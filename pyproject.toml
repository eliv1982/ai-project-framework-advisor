[project]
name = "ai-project-framework-advisor"
version = "0.1.0"
description = "Учебный CLI-агент на LangChain: рекомендует фреймворк для ИИ-проекта по локальным профилям, собственным инструментам данных и структурированному ответу."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
framework-advisor = "advisor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
